name: Pengingat tiap 5 menit

# Kenapa workflow ini ada
# -----------------------
# Vercel paket Hobby hanya mengizinkan cron sekali sehari. Konfigurasi cron
# */5 di vercel.json membuat deployment DITOLAK dalam hitungan detik (bukan
# gagal build) — itu penyebab deploy repo ini gagal sejak commit 943060b.
#
# Supaya pengingat tetap tiap 5 menit tanpa harus naik ke paket berbayar,
# pemicunya dipindah ke GitHub Actions yang mengizinkan jadwal per-menit.
# Vercel tetap punya cron harian sebagai jaring pengaman.
#
# CARA MENGAKTIFKAN
# -----------------
# Isi dua secret di Settings -> Secrets and variables -> Actions:
#   APP_URL      contoh: https://mbg-xi.vercel.app
#   CRON_SECRET  nilai yang sama dengan CRON_SECRET di environment Vercel
#
# Kalau secret belum diisi, workflow ini berhenti dengan pesan dan TIDAK gagal,
# jadi tidak mengotori riwayat CI.
#
# Catatan: penjadwal GitHub bisa terlambat beberapa menit saat beban tinggi, dan
# workflow terjadwal otomatis nonaktif setelah 60 hari tanpa aktivitas repo.
# Endpoint /api/cron/notify aman dipanggil berulang karena menandai tugas yang
# sudah dikabari, jadi cron harian Vercel tidak menyebabkan kirim ganda.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: reminder-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil endpoint pengingat
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET belum diisi di secret repo."
            echo "Pengingat latar belakang belum aktif. Lihat catatan di file workflow ini."
            exit 0
          fi
          code=$(curl -sS -o /tmp/sweep.json -w '%{http_code}' \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/notify")
          echo "HTTP $code"
          cat /tmp/sweep.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Endpoint pengingat membalas $code"
            exit 1
          fi
